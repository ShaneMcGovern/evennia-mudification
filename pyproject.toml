[project]
name = "evennia-mudification"
version = "0.2.0"
description = "A YAML-defined world content engine for Evennia: define rooms, exits and objects as data, then validate, plan, apply and prune them."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shane McGovern", email = "shanemcgovern@protonmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
]

[project.urls]
Repository = "https://github.com/ShaneMcGovern/evennia-mudification"

[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project.scripts]
mudification = "evennia_mudification.cli:main"

[dependency-groups]
dev = [
    "genbadge[coverage]>=1.1.3",
    "mypy>=2.3.1",
    "types-PyYAML>=6",
    "pre-commit>=4.6.2",
    "ruff>=0.16.4",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "evennia>=6.1.0",
    "pytest-django>=4.14.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "evennia.settings_default"
testpaths = ["tests"]
# --import-mode=importlib avoids the default mode's globally-unique-filename
# requirement. The 95.4 floor is the enforced minimum: exclude genuinely
# unreachable code with `# pragma: no cover` rather than lowering it.
addopts = "--cov --cov-report=xml --cov-report=term --import-mode=importlib --cov-fail-under=95.4"

[tool.coverage.run]
source = ["evennia_mudification"]
branch = true

[tool.ruff]
line-length = 88
# target-version is deliberately unset: ruff infers it from requires-python.

[tool.ruff.lint]
# flake8-executable (EXE) is deliberately NOT selected: its rules key off the
# filesystem executable bit, which a Windows/WSL2 bind mount reports as 0755
# while git tracks the same files as 0644, so EXE002 fails in the container and
# passes in CI, for files that are not scripts and carry no shebang.
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "N",
    "SIM",
    "PTH",
    "ARG",
    "TID",
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# Test fixtures are often accepted but unreferenced.
"tests/*" = ["ARG"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
files = ["src", "tests"]
strict = true
warn_unreachable = true
# python_version is deliberately unset: mypy infers it from the interpreter.

# Evennia and Django ship no py.typed marker, so their modules are Any to mypy
# and every Evennia-based test fails strict mode twice: once on the import,
# once on subclassing the Any base. tests/ drops only the subclassing check;
# src/ keeps full strictness.
[[tool.mypy.overrides]]
module = ["evennia.*", "django.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_subclassing_any = false

[tool.semantic_release]
# The version lives in exactly one place; no version_variables, since a second
# copy in __init__.py would drift.
version_toml = ["pyproject.toml:project.version"]
# Re-locks so uv.lock's recorded version follows the bump PSR just wrote;
# without it every release leaves the lock stale and the uv-lock hook fails.
build_command = "uv lock"
assets = ["uv.lock"]
commit_parser = "conventional"
# Stay on the 0.x line: with this false, PSR's first release jumps to 1.0.0.
allow_zero_version = true
commit_message = "chore(release): {version} [skip ci]"
tag_format = "v{version}"

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.changelog]
mode = "update"
insertion_flag = "<!-- version list -->"
