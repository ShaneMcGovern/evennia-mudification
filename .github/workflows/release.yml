---
name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write
      issues: write
      pull-requests: write

    # Shared with validate.yml's badge job; both push to main.
    concurrency:
      group: main-writes
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          # Required: python-semantic-release walks the full commit history and
          # tag list to compute the next version. A shallow clone breaks it.
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Configure git identity for the release commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # NOT the python-semantic-release Docker action. That action's image is
      # built with `pip install --pre`, so it resolves pre-release dependencies at
      # image-build time and offers no way to pin a transitive one. That is what
      # made it unusable when GitPython briefly dropped Actor.name_email_regex;
      # GitPython restored that attribute as a deprecation shim in 3.1.61 and PSR
      # no longer references it, but the pre-release resolution that caused the
      # problem has not changed.
      #
      # uvx rather than a dev dependency, unlike the template repository's own
      # copy of this workflow: a release tool only this job runs should not be
      # installed by every `uv sync --all-groups`, in CI and in the dev container.
      # The cost is that no Dependabot ecosystem can see this pin - the uv one
      # reads pyproject.toml and uv.lock, github-actions reads `uses:` - so bump
      # it by hand when the template's own PSR moves.
      #
      # Configuration comes from [tool.semantic_release] in pyproject.toml.
      - name: Python Semantic Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uvx --from python-semantic-release==10.6.2 semantic-release -v version
