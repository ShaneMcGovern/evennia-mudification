---
name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write
      issues: write
      pull-requests: write

    # Shared with validate.yml's badge job; both push to main.
    concurrency:
      group: main-writes
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          # PSR walks the full history and tag list.
          fetch-depth: 0

      # The badge job shares the main-writes concurrency group and may push its
      # commit first; the checkout is pinned to the commit that triggered the
      # run, and PSR refuses to release when origin/main has moved past it.
      - name: Fast-forward to the branch tip
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Configure git identity for the release commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # uvx, not the PSR Docker action: that image resolves pre-release
      # dependencies at build time with no way to pin a transitive one. Not a
      # dev dependency either: only this job runs it. Dependabot cannot see this
      # pin, so bump it by hand; configuration is in pyproject.toml.
      - name: Python Semantic Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uvx --from python-semantic-release==10.6.2 semantic-release -v version
