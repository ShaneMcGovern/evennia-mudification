---
name: Validate

on:
  # Every branch, including main: the badge job below only runs there.
  push:
  # A green pull request run is the quality gate a PR must clear before merge.
  # The repository has no required status checks, so this job cannot block a
  # merge by itself; release.yml refuses to release a commit whose PR has no
  # green run.
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  pre-commit:
    name: Pre-commit (all hooks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          # The commit-msg checks below walk the pull request's commits, so
          # the base commit and the branch history must be present.
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Cache pre-commit hook environments
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          # Editing a hook revision would otherwise be a full cold miss.
          restore-keys: |
            pre-commit-

      # The ruff and mypy hooks run through `uv run`; the environment must exist.
      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Run all pre-commit hooks
        run: uv run pre-commit run --all-files --show-diff-on-failure

      # `--all-files` runs the default stage only. The commit-msg hooks need
      # one message at a time; pre-commit ignores --from-ref/--to-ref for that
      # stage.
      - name: Run the commit-msg hooks over the pull request commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          while read -r sha; do
            git log -1 --format='%B' "$sha" > /tmp/commit-msg.txt
            if ! uv run pre-commit run --hook-stage commit-msg \
              --commit-msg-filename /tmp/commit-msg.txt; then
              echo "::error::the commit-msg hooks failed for commit $sha"
              status=1
            fi
          done < <(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA")
          exit "$status"

      # A squash merge turns the pull request title into the subject on main,
      # and a non-conventional subject silently produces no release.
      - name: Check the pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE" > /tmp/pr-title.txt
          uv run pre-commit run conventional-pre-commit \
            --hook-stage commit-msg --commit-msg-filename /tmp/pr-title.txt

  test:
    name: Run tests
    needs: pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Validate fixture content
        run: uv run mudification validate tests/fixtures/corpus/basic

      - name: Run tests
        run: uv run pytest -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

  # This job runs the project's own test code while holding contents: write, so
  # it is a separate job from `test`: merging them would hand that grant to
  # whatever the tests execute.
  badge:
    name: Update coverage badge
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    # Shared with release.yml so pushes to main cannot race.
    concurrency:
      group: main-writes
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Download coverage report
        uses: actions/download-artifact@v8.0.1
        with:
          name: coverage

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      # genbadge omits the trailing newline and this job commits the file
      # directly (no hooks in CI), so end-of-file-fixer would fail on the next
      # push. Add it here.
      - name: Regenerate the coverage badge
        run: |
          uv run genbadge coverage -i coverage.xml -o badges/coverage.svg
          printf '\n' >> badges/coverage.svg

      - name: Commit the badge if it changed
        run: |
          if git diff --quiet -- badges/coverage.svg; then
            echo "Coverage badge unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add badges/coverage.svg
          git commit -m "chore: update coverage badge [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
