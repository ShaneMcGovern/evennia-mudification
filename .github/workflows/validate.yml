---
name: Validate

on:
  # Every branch, including main: a squash-merged commit is a commit no CI run
  # has ever seen, and the badge job below only runs there.
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  pre-commit:
    name: Pre-commit (all hooks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      # Without this, `uv run` is `command not found` and the job dies at
      # exit 127, which is what happened on every run before this change.
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Cache pre-commit hook environments
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          # Without this, editing any hook revision is a full cold miss and
          # every environment rebuilds. The stale cache is still mostly valid.
          restore-keys: |
            pre-commit-

      # The local ruff and mypy hooks shell out to `uv run`, so the project
      # environment has to exist before the hooks run.
      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Run all pre-commit hooks
        run: uv run pre-commit run --all-files --show-diff-on-failure

  test:
    name: Run tests
    needs: pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      # No python-version input: uv reads .python-version, so the interpreter
      # pin lives in exactly one place.
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Run tests
        run: uv run pytest -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

  # A deliberate choice, not inherited furniture: a generated project starts as
  # one file printing one line, and this chain — a job, a genbadge dev
  # dependency, a committed SVG, a README badge and a contents: write grant —
  # is the largest single thing it carries. It is kept because a coverage badge
  # is standard equipment for a Python repository, and adding one later means
  # rediscovering all of that; a project that does not want it deletes this job,
  # the upload step above, genbadge from the dev group, and badges/.
  #
  # A separate job rather than a step in `test` on purpose: `test` runs the
  # project's own test code, and this job holds contents: write on main. Merging
  # them would hand that grant to whatever the tests execute.
  badge:
    name: Update coverage badge
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    # Shared with release.yml so the two workflows cannot race each other
    # pushing to main. This is the mechanism the design relies on.
    concurrency:
      group: main-writes
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # Reuse the coverage the test job already measured rather than re-running
      # the suite to regenerate an identical file.
      - name: Download coverage report
        uses: actions/download-artifact@v8.0.1
        with:
          name: coverage

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      # genbadge writes the SVG without a trailing newline, and this job commits
      # it directly (CI has no pre-commit hooks installed), so end-of-file-fixer
      # would fail on the next run for everyone else. Add the newline here.
      - name: Regenerate the coverage badge
        run: |
          uv run genbadge coverage -i coverage.xml -o badges/coverage.svg
          printf '\n' >> badges/coverage.svg

      - name: Commit the badge if it changed
        run: |
          if git diff --quiet -- badges/coverage.svg; then
            echo "Coverage badge unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add badges/coverage.svg
          git commit -m "chore: update coverage badge [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
