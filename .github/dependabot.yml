---
version: 2

# Each ecosystem repeats the commit-message block; the schema leaves no
# top-level key to hang an anchor off. "chore" is deliberate: Dependabot's
# default subject is not conventional, and a non-conventional one silently
# produces no release under PSR.

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "docker"
    directory: "/.devcontainer"
    schedule:
      interval: weekly
    # Image tags are toolchain choices, not ordinary dependencies: leaving a
    # line is a deliberate upgrade, not a bot pull request.
    ignore:
      # .python-version pins 3.13; 3.14 is a project decision.
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

      # Pre-1.0: a 0.13 minor can break, so only 0.12.x patches flow.
      - dependency-name: "astral-sh/uv"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      python-patch-versions:
        applies-to: version-updates
        update-types:
          - "patch"
