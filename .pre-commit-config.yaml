---
# Installed by entrypoint.sh; run in CI by validate.yml.
default_install_hook_types: [pre-commit, commit-msg]

# Without this, hooks run at every stage, so the hygiene hooks re-fire against
# COMMIT_EDITMSG and can rewrite the message being committed.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        # devcontainer.json is JSONC, where comments are valid.
        exclude: ^\.devcontainer/devcontainer\.json$
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  # Maintained fork; pre-commit/mirrors-prettier was archived upstream.
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.6
    hooks:
      - id: prettier
        # TOML is deliberately absent: prettier cannot parse it without a plugin.
        types_or: [yaml, json]
        # devcontainer.json is JSONC; .copier-answers.yml is copier's own
        # single-quoted output, which prettier would fight on every update.
        exclude: ^(\.devcontainer/devcontainer\.json|\.copier-answers\.yml)$

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      # CHANGELOG.md is excluded: python-semantic-release's blank lines trip
      # MD012, and the release commit carries [skip ci], so the failure would
      # land on the next push.
      - id: markdownlint-fix
        exclude: ^CHANGELOG\.md$

  # Fails on lock drift, which CI's `uv sync --frozen` would otherwise hit.
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.7
    hooks:
      - id: uv-lock

  # A non-conventional subject silently produces no release, so it is caught at
  # commit time; commit-msg is the one stage CI cannot run.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  # Local hooks: a mirrored mypy cannot see project dependencies, and ruff stays
  # one version through uv.lock.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
