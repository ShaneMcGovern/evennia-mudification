---
# Installed by .devcontainer/entrypoint.sh; run in CI by .github/workflows/validate.yml.
default_install_hook_types: [pre-commit, commit-msg]

# Without this, hooks with no explicit `stages` run at EVERY stage, so the
# hygiene hooks fire a second time against COMMIT_EDITMSG on each commit - both
# wasteful and capable of rewriting a commit message. Only
# conventional-pre-commit opts back in to commit-msg, below.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        # devcontainer.json is JSONC - comments are valid there, not in JSON.
        exclude: ^\.devcontainer/devcontainer\.json$
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  # Maintained fork; pre-commit/mirrors-prettier was archived upstream.
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.6
    hooks:
      - id: prettier
        # TOML is deliberately absent: prettier cannot parse it without a plugin.
        types_or: [yaml, json]
        # devcontainer.json is JSONC. .copier-answers.yml is written by copier,
        # whose to_nice_yaml emits single-quoted strings where prettier wants
        # double - so without this every `copier update` reintroduces a diff the
        # hook then fights. The file itself says never to edit it by hand.
        exclude: ^(\.devcontainer/devcontainer\.json|\.copier-answers\.yml)$

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      # MD013 (line length) is disabled in .markdownlint.json, not by a flag here.
      #
      # CHANGELOG.md is excluded because, where releases are automated,
      # python-semantic-release generates it and emits two blank lines between
      # release sections, which trips MD012. The release commit carries
      # [skip ci], so that lands unchecked and then fails the NEXT push - CI red
      # after every single release. Its formatting is the generator's to own,
      # and the docs already say never to edit it by hand. The exclude is kept
      # unconditionally: it costs nothing when there is no CHANGELOG.md, and
      # this file has no suffix, so it cannot carry a conditional.
      - id: markdownlint-fix
        exclude: ^CHANGELOG\.md$

  # Fails when uv.lock has drifted from pyproject.toml, which is what CI's
  # `uv sync --frozen` would otherwise discover the hard way.
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.7
    hooks:
      - id: uv-lock

  # Enforced at commit time because a bad message is only fixable before the
  # commit exists. Where releases are automated, python-semantic-release derives
  # them from these subjects and a non-conventional one does not error - it
  # silently produces no release. Where they are not, this still keeps the
  # history readable and leaves the option open.
  #
  # commit-msg is the one stage CI cannot run: `pre-commit run --all-files` has
  # no commit message to check. CONTRIBUTING.md says so rather than implying the
  # branch is guarded.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  # ruff and mypy run from the project environment rather than from pre-commit's
  # isolated one. For mypy that is necessary: the mirrored hook cannot see
  # project dependencies and reports false import errors as soon as there are
  # any. For ruff it removes a second version pin, so `uv run ruff` and this hook
  # cannot drift apart and enforce different rules.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
